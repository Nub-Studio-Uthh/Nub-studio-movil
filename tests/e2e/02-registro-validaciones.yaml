# HU-06: el registro muestra los mensajes de validación.
# La app abre en Inicio sin sesión: al registro se llega desde la pestaña Cuenta.
appId: com.nubstudio.movil
---
- launchApp:
    clearState: true
- tapOn:
    id: 'tab-cuenta'
- tapOn:
    id: 'cuenta-iniciar-sesion'
- tapOn:
    id: 'login-registrate'
- tapOn:
    id: 'registro-correo'
- inputText: 'correo-invalido'
- tapOn:
    id: 'registro-enviar'
- assertVisible: 'Ingresa un correo válido'

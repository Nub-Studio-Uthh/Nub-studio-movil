# HU-05: un visitante lee el blog sin iniciar sesión.
# Los datos de prueba (scripts/entorno/sql/04-datos-prueba.sql) traen 3 publicaciones.
appId: com.nubstudio.movil
---
- launchApp:
    clearState: true
# Sin sesión la app abre en Login (HU-06): se entra como visitante.
- tapOn:
    id: 'login-explorar'
- assertVisible: 'Descubre arte huasteco'
- tapOn:
    id: 'abrir-blog'
- assertVisible: 'Historias del arte huasteco'
- takeScreenshot: 05-blog
# La primera tarjeta es la publicación más reciente.
- tapOn:
    id: 'blog-post-0'
- assertVisible:
    id: 'post-titulo'
- assertVisible:
    id: 'post-contenido'
- takeScreenshot: 05-publicacion
- tapOn:
    id: 'post-regresar'
- assertVisible: 'Historias del arte huasteco'

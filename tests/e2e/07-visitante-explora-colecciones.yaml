# HU-04: un visitante explora las colecciones sin iniciar sesión.
# Los datos de prueba (scripts/entorno/sql/04-datos-prueba.sql) traen una colección
# publicada con 3 obras.
appId: com.nubstudio.movil
---
- launchApp:
    clearState: true
# En el emulador de CI la app tarda en abrir: se espera a que aparezca Login.
- extendedWaitUntil:
    visible:
      id: 'login-explorar'
    timeout: 60000
# Sin sesión la app abre en Login (HU-06): se entra como visitante.
- tapOn:
    id: 'login-explorar'
- assertVisible: 'Descubre arte huasteco'
# "Ver todas" de la sección Colecciones en Inicio.
- scrollUntilVisible:
    element:
      id: 'ver-colecciones'
- tapOn:
    id: 'ver-colecciones'
- assertVisible:
    id: 'colecciones-lista'
- takeScreenshot: 07-colecciones
# La primera tarjeta abre el detalle con su descripción y sus obras.
- tapOn:
    id: 'coleccion-tarjeta-0'
- assertVisible:
    id: 'coleccion-nombre'
- assertVisible: 'Obras de la colección'
- takeScreenshot: 07-coleccion
- tapOn:
    id: 'coleccion-regresar'
- assertVisible:
    id: 'colecciones-lista'

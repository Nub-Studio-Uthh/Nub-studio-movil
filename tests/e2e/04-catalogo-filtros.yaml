# HU-01: los filtros del catálogo se combinan y se limpian, y sin resultados
# se muestra un mensaje claro.
appId: com.nubstudio.movil
---
- launchApp:
    clearState: true
- tapOn:
    id: 'tab-catalogo'
- assertVisible:
    id: 'obra-card-0'

# Combinar categoría + rango de precio
- tapOn:
    id: 'abrir-filtros'
- assertVisible: 'Filtros'
# Grabado tiene obras entre $500 y $3,000 en los datos de desarrollo (Pintura no).
- tapOn: 'Grabado'
- tapOn:
    id: 'precio-minimo'
- inputText: '500'
- tapOn:
    id: 'precio-maximo'
- inputText: '3000'
- hideKeyboard
- tapOn: 'APLICAR (2)'
- assertVisible:
    id: 'obra-card-0'

# Un rango sin obras muestra el mensaje de vacío
- tapOn:
    id: 'abrir-filtros'
- tapOn:
    id: 'precio-minimo'
- eraseText
- inputText: '1'
- tapOn:
    id: 'precio-maximo'
- eraseText
- inputText: '2'
- hideKeyboard
- tapOn:
    id: 'aplicar-filtros'
- assertVisible: 'No hay obras con esos filtros'

# Limpiar regresa todo el catálogo
- tapOn: 'LIMPIAR FILTROS'
- assertVisible:
    id: 'obra-card-0'
- assertNotVisible: 'No hay obras con esos filtros'

# Un mínimo mayor que el máximo no se puede aplicar
- tapOn:
    id: 'abrir-filtros'
- tapOn:
    id: 'precio-minimo'
- inputText: '3000'
- tapOn:
    id: 'precio-maximo'
- inputText: '500'
- hideKeyboard
- assertVisible:
    id: 'error-precio'

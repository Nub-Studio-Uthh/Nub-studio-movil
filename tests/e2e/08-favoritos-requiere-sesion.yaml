# HU-07: un visitante que intenta guardar una obra en favoritos debe iniciar sesión.
appId: com.nubstudio.movil
---
- launchApp:
    clearState: true
# En el emulador de CI la app tarda en abrir: se espera a que aparezca Login.
- extendedWaitUntil:
    visible:
      id: 'login-explorar'
    timeout: 60000
# Sin sesión la app abre en Login (HU-06): se entra como visitante.
- tapOn:
    id: 'login-explorar'
# La pestaña Favoritos invita a iniciar sesión.
- tapOn:
    id: 'tab-favoritos'
- assertVisible:
    id: 'favoritos-invitado'
- takeScreenshot: 08-favoritos-invitado
# En el detalle de una obra, el corazón también pide iniciar sesión.
- tapOn:
    id: 'tab-catalogo'
- tapOn:
    id: 'obra-card-0'
- tapOn:
    id: 'detalle-favorito'
- assertVisible: 'Para guardar obras en tus favoritos necesitas una cuenta.'
- takeScreenshot: 08-favorito-pide-sesion
- tapOn: 'Iniciar sesión'
- assertVisible:
    id: 'login-explorar'

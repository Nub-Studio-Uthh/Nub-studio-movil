# HU-03: un visitante abre el perfil de un artista desde el detalle de una obra.
# Los datos de prueba (scripts/entorno/sql/04-datos-prueba.sql) traen 2 artistas activos con obras.
appId: com.nubstudio.movil
---
- launchApp:
    clearState: true
# En el emulador de CI la app tarda en abrir: se espera a que aparezca Login.
- extendedWaitUntil:
    visible:
      id: 'login-explorar'
    timeout: 60000
# Sin sesión la app abre en Login (HU-06): se entra como visitante.
- tapOn:
    id: 'login-explorar'
- tapOn:
    id: 'ver-catalogo'
- tapOn:
    id: 'obra-card-0'
- tapOn:
    id: 'artista-card'
- assertVisible:
    id: 'perfil-nombre'
- assertVisible: 'Sus obras'
- takeScreenshot: 06-perfil-artista
# Cada obra del artista abre su detalle.
- tapOn:
    id: 'perfil-obra-0'
- assertVisible:
    id: 'detalle-regresar'

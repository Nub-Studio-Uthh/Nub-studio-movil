# SEGURIDAD
# Complementa al análisis estático (01): busca patrones de código inseguro
# con Semgrep (SAST) y revisa TODO el historial de git con gitleaks, que
# también detecta secretos que no se pueden verificar (contraseñas de base
# de datos, JWT_SECRET, etc.). Corre en cada Pull Request y cada lunes.
name: Seguridad

on:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 8 * * 1' # lunes 02:00 hora de Huejutla (UTC-6)
  workflow_dispatch:

jobs:
  sast:
    name: Semgrep (código inseguro)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Analizar JavaScript y React
        run: >
          semgrep scan
          --config p/javascript
          --config p/react
          --exclude docs
          --metrics off
          --error

  secretos-historial:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Se usa el binario oficial y no gitleaks-action, que pide licencia
      # de pago en repositorios de organizaciones.
      - name: Instalar gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Buscar secretos en todos los commits
        run: ./gitleaks git --redact --verbose

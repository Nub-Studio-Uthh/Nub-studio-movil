name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Linter
        run: pnpm lint
      - name: Build
        run: pnpm expo export --platform android

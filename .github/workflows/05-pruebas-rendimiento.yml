# PRUEBAS DE RENDIMIENTO
# Miden el tiempo de respuesta de la API con carga normal (usuarios
# simultáneos esperados) usando k6. Corren al preparar una versión
# (rama release/*) o de forma manual. Issue #55 (parte del API).
name: Pruebas de rendimiento

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

jobs:
  rendimiento:
    name: Carga normal con k6
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: mkdir -p reports
      - name: Verificar URL del backend
        if: env.API_URL == ''
        run: |
          echo "::error::Configura el secreto API_URL_STAGING para correr esta prueba."
          exit 1
      - name: Prueba de carga
        run: k6 run --summary-export=reports/carga.json tests/performance/carga.js
      - name: Guardar resumen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumen-k6-carga
          path: reports/

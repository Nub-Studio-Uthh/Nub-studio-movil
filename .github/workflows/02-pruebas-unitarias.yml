# PRUEBAS UNITARIAS
# Prueban funciones y componentes aislados con Jest (preset jest-expo).
# Corren en cada Pull Request y exigen una cobertura mínima.
name: Pruebas unitarias

on:
  pull_request:
    branches: [develop, main]

jobs:
  unitarias:
    name: Jest + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ejecutar pruebas unitarias
        run: pnpm test:unit --ci --coverage
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-unitarias
          path: coverage/
          retention-days: 14

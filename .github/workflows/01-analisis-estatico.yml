# ANÁLISIS DE CÓDIGO ESTÁTICO
# Revisa el código sin ejecutarlo: estilo, errores comunes, dependencias
# vulnerables y secretos subidos por error. Corre en cada Pull Request.
name: Análisis estático

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint-y-formato:
    name: ESLint y Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint (reglas de Expo + Prettier)
        run: pnpm lint
      - name: Formato con Prettier
        run: pnpm format:check

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Buscar vulnerabilidades altas o críticas
        run: pnpm audit --prod --audit-level high

  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog (tokens, contraseñas y llaves expuestas)
        uses: trufflesecurity/trufflehog@v3.90.0
        with:
          extra_args: --only-verified

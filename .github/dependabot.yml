# Dependabot: avisos y PR automáticos de dependencias.
# Requiere activar en GitHub (Settings → Code security) "Dependabot alerts"
# y "Dependabot security updates".
version: 2
updates:
  - package-ecosystem: npm # también cubre pnpm
    directory: /
    schedule:
      interval: weekly
    # 0 = no abre PR de versiones nuevas, solo las de seguridad.
    # Las versiones de Expo/React Native van atadas al SDK y se actualizan
    # a mano con `pnpm expo install --fix`.
    open-pull-requests-limit: 0
    target-branch: develop
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: ci
    ignore:
      # Desde la v6, el caché de gradle/actions es un componente de código cerrado con sus
      # propios Términos de Uso. El equipo se queda en la v5 (licencia MIT, ya corre en Node 24).
      - dependency-name: gradle/actions
        versions: ['>= 6']
